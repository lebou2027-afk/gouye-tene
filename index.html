<body>

<div id="login">
  <div class="logo">GT</div>
  <h1>QUINCAILLERIE GÉNÉRALE<br>GOUYE TENE</h1>
  <div class="sub">Choisissez un magasin puis saisissez votre code</div>

    <div class="dots" id="dots"></div>
    <div class="keys" id="keys"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const today=()=>new Date().toISOString().slice(0,10);
const num=n=>(Math.round(+n||0)).toLocaleString('fr-FR');
const fmt=n=>num(n)+' FCFA';
const fd=d=>d?d.split('-').reverse().join('/'):'';
const MEM={};
function lg(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return MEM[k]!==undefined?JSON.parse(MEM[k]):d}
function ls(k,v){MEM[k]=JSON.stringify(v);try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- données ---------- */
const MODES=['Espèces','Wave','Orange Money','Chèque','Virement'];
const ROLES={admin:'Administrateur',gerant:'Gérant',vendeur:'Vendeur'};
const ICONS=['🏪','🏬','🏗️','🔧','🧰','🏠','🚚','📦'];
let G=lg('gt_g',null)||{stores:[{id:'s1',name:'Magasin Principal',icon:'🏪'},{id:'s2',name:'Magasin 2',icon:'🏬'}],users:[{id:'u1',name:'Administrateur',code:'1234',role:'admin',stores:['*']}]};

let LS=G.stores[0].id,CODE='';
function drawLogin(){
  if(!G.stores.find(s=>s.id===LS))LS=G.stores[0].id;
  $('#lstores').innerHTML=G.stores.map(s=>`<div class="sc ${s.id===LS?'on':''}" onclick="LS='${s.id}';drawLogin()"><div class="ic">${s.icon}</div><b>${esc(s.name)}</b></div>`).join('');
  $('#dots').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<CODE.length?'f':''}"></i>`).join('');
  $('#keys').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="kp('${n}')">${n}</button>`).join('')+`<button onclick="kp('x')">⌫</button><button onclick="kp('0')">0</button><button class="ok" onclick="kp('ok')">OK</button>`;
}
function kp(k){
  $('#lerr').textContent='';
  if(k==='x')CODE=CODE.slice(0,-1);

  else if(CODE.length<6)CODE+=k;

}
document.addEventListener('keydown',e=>{if($('#login').classList.contains('hide'))return;if(/^\d$/.test(e.key))kp(e.key);else if(e.key==='Backspace')kp('x');else if(e.key==='Enter')kp('ok')});
function tryLogin(){
  const u=G.users.find(u=>u.code===CODE);
  if(!u||!(u.stores.includes('*')||u.stores.includes(LS))){CODE='';drawLogin();$('#lerr').textContent='Code incorrect ou accès refusé à ce magasin';return}
  USER=u;SID=LS;CODE='';loadStore(SID);ls('gt_last',{u:u.id,s:SID});
  $('#login').classList.add('hide');$('#app').classList.remove('hide');page='dash';render();
}

/* ---------- calculs ---------- */
const sumL=l=>l.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);
function solde(kind,id){
  if(kind==='client'){const c=D.clients.find(x=>x.id===id);return D.docs.facture.filter(d=>d.tid===id).reduce((a,d)=>a+d.total-(d.paid||0),0)-((c&&c.credit)||0)}
  const f=D.fournisseurs.find(x=>x.id===id);return D.reappro.filter(r=>r.fid===id).reduce((a,r)=>a+r.total-(r.paid||0),0)-((f&&f.credit)||0)}
function settle(kind,id,amount,mode){
  const list=(kind==='client'?D.docs.facture.filter(d=>d.tid===id):D.reappro.filter(r=>r.fid===id)).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let left=amount;
  for(const d of list){const due=d.total-(d.paid||0);if(due>0&&left>0){const p=Math.min(due,left);d.paid=(d.paid||0)+p;left-=p}}
  if(left>0){const e=(kind==='client'?D.clients:D.fournisseurs).find(x=>x.id===id);e.credit=(e.credit||0)+left}
  D.paiements.push({id:uid(),date:today(),kind,tid:id,amount,mode});save();
}
function stat(d){return d.paid>=d.total&&d.total>0?['Payé','t-ok']:d.paid>0?['Partiel','t-w']:['Impayé','t-b']}
function stockState(p){return p.stock<=0?['Rupture','t-b']:p.stock<=(+p.seuil||0)?['Faible','t-w']:['OK','t-ok']}
function caisse(){
  return D.docs.facture.reduce((a,d)=>a+(d.paid||0),0)+D.clients.reduce((a,c)=>a+(c.credit||0),0)
   +D.argent.reduce((a,x)=>a+(x.sens==='Entrée'?x.amount:-x.amount),0)
   -D.charges.reduce((a,c)=>a+c.amount,0)-D.reappro.reduce((a,r)=>a+(r.paid||0),0)-D.fournisseurs.reduce((a,f)=>a+(f.credit||0),0)}

let CART=[],POS={tid:'',remise:0,paid:null,mode:'Espèces',sid:null};

function padd(id){const p=D.produits.find(x=>x.id===id);if(!p)return;const l=CART.find(x=>x.pid===id);if(l)l.qty++;else CART.push({pid:id,ref:p.ref,name:p.name,qty:1,price:+p.pv||0});drawCart()}
function pset(i,k,v){CART[i][k]=Math.max(0,+v||0);drawCart()}
function pdel(i){CART.splice(i,1);drawCart()}
function pclear(){CART=[];POS.remise=0;POS.paid=null;POS.tid='';drawCart()}
function drawCart(){const e=$('#poscart');if(e)e.innerHTML=cartHtml()}
function ptHtml(){const t=posTot().t,r=POS.paid==null?t:+POS.paid;return`Total : <b>${fmt(t)}</b><br>${r>=t?`Monnaie à rendre : <b>${fmt(r-t)}</b>`:`Reste à payer : <b style="color:var(--rd)">${fmt(t-r)}</b>`}`}

  <label>Client<select onchange="POS.tid=this.value"><option value="">— Client comptoir —</option>${D.clients.map(c=>`<option value="${c.id}" ${c.id===POS.tid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  ${CART.length?`<table class="lt" style="margin-top:8px"><thead><tr><th>Produit</th><th class="r">Qté</th><th class="r">Prix</th><th class="r">Total</th><th></th></tr></thead><tbody>${CART.map((l,i)=>`<tr><td>${esc(l.name)}</td><td class="r"><input type="number" min="0" value="${l.qty}" style="width:60px" onchange="pset(${i},'qty',this.value)"></td><td class="r"><input type="number" value="${l.price}" onchange="pset(${i},'price',this.value)"></td><td class="r">${num(l.qty*l.price)}</td><td><button class="btn sm dg" onclick="pdel(${i})">✕</button></td></tr>`).join('')}</tbody><tfoot><tr><td>Total brut</td><td class="r">${CART.reduce((a,l)=>a+l.qty,0)}</td><td></td><td class="r">${num(posTot().s)}</td><td></td></tr></tfoot></table>`:'<div class="empty">Touchez un produit pour l\'ajouter.</div>'}
  <div class="grid2" style="margin-top:8px"><label>Remise (FCFA)<input type="number" value="${POS.remise||0}" oninput="POS.remise=+this.value||0;drawPT()"></label><label>Mode de paiement<select onchange="POS.mode=this.value">${MODES.map(m=>`<option ${m===POS.mode?'selected':''}>${m}</option>`).join('')}</select></label>
  <label class="full">Montant reçu (FCFA) — vide = payé comptant<input type="number" value="${POS.paid==null?'':POS.paid}" placeholder="Montant exact" oninput="POS.paid=this.value===''?null:+this.value;drawPT()"></label></div>

  <div class="mb"><button class="btn dg" onclick="pclear()">Vider</button><button class="btn pri" onclick="psale()">✅ Valider</button><button class="btn gold" onclick="psale('ticket')">🎫 Valider + Ticket</button><button class="btn gold" onclick="psale('a4')">🧾 Valider + Facture</button></div></div>`}
function psale(act){
  if(!can('vente','a'))return toast('Droit insuffisant');
  const lines=CART.filter(l=>l.qty>0).map(l=>({pid:l.pid,ref:l.ref,name:l.name,qty:l.qty,price:l.price}));

  stockMove(lines,-1);D.docs.facture.push(d);save();

function radd(){const p=D.produits.find(x=>x.name===$('#rp').value||x.ref===$('#rp').value);if(!p)return toast('Choisissez un produit existant');const q=+$('#rq').value;if(q<=0)return toast('Quantité invalide');RL.push({pid:p.id,name:p.name,qty:q,price:+$('#rpa').value||0});$('#rp').value='';$('#rq').value=1;rdraw()}
function rquick(id){const p=D.produits.find(x=>x.id===id);RL.push({pid:p.id,name:p.name,qty:Math.max(1,(+p.seuil||0)*2-p.stock),price:p.pa});rdraw();toast('Ajouté à la liste')}

function updL(i,k,v){F.o.lines[i][k]=+v||0;const l=F.o.lines[i];$('#lt'+i).textContent=num(l.qty*l.price);drawTot()}
function drawTot(){

function stockCheck(lines,old){
  const bad=[];lines.forEach(l=>{const p=D.produits.find(x=>x.id===l.pid);if(!p)return;const av=p.stock+(old||[]).filter(x=>x.pid===l.pid).reduce((a,x)=>a+x.qty,0);const need=lines.filter(x=>x.pid===l.pid).reduce((a,x)=>a+x.qty,0);if(need>av&&!bad.includes(p.name))bad.push(p.name+' (dispo : '+av+')')});
  return!bad.length||confirm('Stock insuffisant pour :\n'+bad.join('\n')+'\n\nContinuer quand même ?')}
function stockMove(lines,sign){lines.forEach(l=>{const p=D.produits.find(x=>x.id===l.pid);if(p)p.stock+=sign*l.qty})}
function saveDoc(){
  const{type,id,o}=F;if(!can(type,id?'m':'a'))return toast('Droit insuffisant');if(!o.lines.length)return toast('Ajoutez au moins une ligne');
  const old=id?D.docs[type].find(x=>x.id===id):null;
  if(type==='facture'&&!stockCheck(o.lines,old&&old.lines))return;
  o.date=$('#fdate').value||today();o.tid=$('#fwho').value;o.remise=+$('#frem').value||0;o.note=$('#fnote').value;
  o.total=Math.max(0,sumL(o.lines)-o.remise);
  if(type==='bc'&&!o.tid)return toast('Choisissez un fournisseur');
  if(type==='facture'){o.paid=Math.min(o.total,+$('#fpaid').value||0);o.mode=$('#fmode').value;o.due=$('#fdue').value||o.date}
  if(!id)o.by=USER.name;
  const w=whoList(type).find(x=>x.id===o.tid);o.tname=w?w.name:(DT[type].who==='client'?'Client comptoir':'');
  if(type==='facture'&&old)stockMove(old.lines,1);
  if(type==='facture')stockMove(o.lines,-1);
  if(id){const i=D.docs[type].findIndex(x=>x.id===id);D.docs[type][i]=Object.assign(old,o)}
  else{o.id=uid();o.num=nextNum(type,DT[type].p);D.docs[type].push(o)}

}

function statLabel(d,type){if(type!=='facture')return'';return`<div class="st">${stat(d)[0].toUpperCase()}</div>`}
function nfr(n){n=Math.floor(Math.abs(n));if(!n)return'zéro';
  const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],t=['','','vingt','trente','quarante','cinquante','soixante'];
  const b100=(x,fin)=>{if(x<20)return u[x];if(x<70){const d=Math.floor(x/10),r=x%10;return r===0?t[d]:r===1?t[d]+' et un':t[d]+'-'+u[r]}
    if(x<80)return x===71?'soixante et onze':'soixante-'+u[x-60];
    return'quatre-vingt'+(x===80&&fin?'s':'')+(x>80?'-'+u[x-80]:'')};
  const b1000=(x,fin)=>{const h=Math.floor(x/100),r=x%100;let s='';if(h)s=(h>1?u[h]+' ':'')+'cent'+(h>1&&!r&&fin?'s':'');if(r)s+=(s?' ':'')+b100(r,fin);return s};
  const m=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(m)p.push(m===1?'un million':b1000(m,true)+' millions');
  if(th)p.push(th===1?'mille':b1000(th,false)+' mille');
  if(r)p.push(b1000(r,true));
  return p.join(' ')}

function setStamp(id,v){
  if(!can('facture','o'))return toast('Droit insuffisant');
  const d=getDoc('facture',id);if(!d)return;
  if(d.stamp===v){delete d.stamp;save();preview('facture',id);if($('#res'))res();return toast('Mention retirée')}
  const reste=d.total-(d.paid||0);
  if(reste>0&&!confirm('Cette facture a encore un solde dû de '+fmt(reste)+'.\nApposer quand même la mention « '+v+' » ?'))return;
  d.stamp=v;save();preview('facture',id);if($('#res'))res();toast('Mention « '+v+' » ajoutée');
}
function wa(type,id){
  const d=getDoc(type,id),w=whoList(type).find(x=>x.id===d.tid)||{};let tel=(w.tel||'').replace(/\D/g,'');if(tel.length===9)tel='221'+tel;
  const t=`${DT[type].s} ${d.num} — ${D.company.name}\nDate : ${fd(d.date)}\nTotal : ${fmt(d.total)}`+(type==='facture'?`\nReste à payer : ${fmt(d.total-(d.paid||0))}`:'')+`\n${D.company.footer}`;
  window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(t),'_blank');
}

/* charges, argent, dépôts */
function catBox(L){const m={},t=L.reduce((a,c)=>a+c.amount,0);L.forEach(c=>m[c.cat]=(m[c.cat]||0)+c.amount);const k=Object.keys(m).sort();return k.length?`<div class="box"><h3>Total par catégorie</h3><table><tbody>${k.map(x=>`<tr><td>${esc(x)}</td><td class="r">${fmt(m[x])}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="r">${fmt(t)}</td></tr></tfoot></table></div>`:''}
const sumS=(L,v)=>L.filter(x=>x.sens===v).reduce((a,x)=>a+x.amount,0);
VIEW.charges=()=>({h:hd('Charges et dépenses','',"openForm('charges')",'Nouvelle charge'),b:()=>{
  const L=D.charges.filter(c=>match(Q,c.label,c.cat,fd(c.date))).sort((a,b)=>b.date.localeCompare(a.date));
  const m=today().slice(0,7);
  return`<div class="cards"><div class="card"><small>Ce mois</small><b>${fmt(D.charges.filter(c=>c.date.slice(0,7)===m).reduce((a,c)=>a+c.amount,0))}</b></div><div class="card"><small>Total général</small><b>${fmt(D.charges.reduce((a,c)=>a+c.amount,0))}</b></div><div class="card"><small>Total affiché (${L.length})</small><b>${fmt(L.reduce((a,c)=>a+c.amount,0))}</b></div></div>`+
  tbl(['Date','Catégorie','Libellé','Mode','>Montant','Actions'],L.map(c=>`<tr><td>${fd(c.date)}</td><td>${esc(c.cat)}</td><td>${esc(c.label)}</td><td>${esc(c.mode)}</td><td class="r">${fmt(c.amount)}</td><td>${ab('charges',c.id)}</td></tr>`),`<tr><td colspan="4">Total</td><td class="r">${fmt(L.reduce((a,c)=>a+c.amount,0))}</td><td></td></tr>`)+catBox(L)}});
VIEW.argent=()=>({h:hd('Dépôt d\'argent','Entrées et sorties de fonds',"openForm('argent')",'Nouveau dépôt'),b:()=>{
  const L=D.argent.filter(c=>match(Q,c.who,c.note,c.mode,fd(c.date))).sort((a,b)=>b.date.localeCompare(a.date));
  const e=D.argent.filter(x=>x.sens==='Entrée').reduce((a,x)=>a+x.amount,0),s=D.argent.filter(x=>x.sens==='Sortie').reduce((a,x)=>a+x.amount,0);
  return`<div class="cards"><div class="card"><small>Total entrées</small><b>${fmt(e)}</b></div><div class="card"><small>Total sorties</small><b>${fmt(s)}</b></div><div class="card"><small>Solde net</small><b>${fmt(e-s)}</b></div></div>`+
  tbl(['Date','Sens','Déposant / Compte','Mode','Note','>Montant','Actions'],L.map(x=>`<tr><td>${fd(x.date)}</td><td><span class="tag ${x.sens==='Entrée'?'t-ok':'t-b'}">${x.sens}</span></td><td>${esc(x.who)}</td><td>${esc(x.mode)}</td><td>${esc(x.note)}</td><td class="r">${fmt(x.amount)}</td><td>${ab('argent',x.id)}</td></tr>`),`<tr><td colspan="5">Total entrées</td><td class="r">${fmt(sumS(L,'Entrée'))}</td><td></td></tr><tr><td colspan="5">Total sorties</td><td class="r">${fmt(sumS(L,'Sortie'))}</td><td></td></tr><tr><td colspan="5">Solde net</td><td class="r">${fmt(sumS(L,'Entrée')-sumS(L,'Sortie'))}</td><td></td></tr>`)}});
VIEW.depots=()=>({h:hd('Dépôts','Lieux de stockage du magasin',"openForm('depots')",'Nouveau dépôt'),b:()=>{
  const L=D.depots.filter(d=>match(Q,d.name,d.addr,d.resp));
  return tbl(['Dépôt','Adresse','Responsable','>Produits','>Valeur du stock','Actions'],L.map(d=>{const ps=D.produits.filter(p=>p.depot===d.name);return`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.addr)}</td><td>${esc(d.resp)}</td><td class="r">${ps.length}</td><td class="r">${fmt(ps.reduce((a,p)=>a+p.stock*p.pa,0))}</td><td>${ab('depots',d.id)}</td></tr>`}),`<tr><td colspan="3">Total (${L.length})</td><td class="r">${L.reduce((a,d)=>a+D.produits.filter(p=>p.depot===d.name).length,0)}</td><td class="r">${fmt(L.reduce((a,d)=>a+D.produits.filter(p=>p.depot===d.name).reduce((x,p)=>x+p.stock*p.pa,0),0))}</td><td></td></tr>`)}});

/* utilisateurs */
VIEW.users=()=>({h:hd('Utilisateurs','Codes d\'accès et droits',"openUser()",'Nouvel utilisateur'),b:()=>{
  const L=G.users.filter(u=>match(Q,u.name,ROLES[u.role]));
  return tbl(['Nom','Rôle','Code','Magasins','Menus','Actions'],L.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${ROLES[u.role]}</td><td>${'•'.repeat(u.code.length)}</td><td>${u.stores.includes('*')?'Tous':u.stores.map(s=>esc((G.stores.find(x=>x.id===s)||{}).name||'')).join(', ')}</td><td>${u.role==='admin'?'Tous':Object.keys(permsOf(u)).length+' menu(s)'}</td><td><div class="act"><button class="btn sm" onclick="openUser('${u.id}')">✏️ Modifier</button><button class="btn sm dg" onclick="delUser('${u.id}')">🗑</button></div></td></tr>`),`<tr><td colspan="6">Total : ${L.length} utilisateur(s) — ${L.filter(u=>u.role==='admin').length} admin · ${L.filter(u=>u.role==='gerant').length} gérant(s) · ${L.filter(u=>u.role==='vendeur').length} vendeur(s)</td></tr>`)}});
function permMatrix(pm){
  return`<div class="box" style="margin:6px 0 0"><table><thead><tr><th>Menu / page</th>${ACTS.map(a=>`<th style="text-align:center">${a[1]}<br><label style="display:inline;font-size:11px;color:#fff"><input type="checkbox" style="width:auto;display:inline;margin:0" onchange="pmCol('${a[0]}',this.checked)"> tout</label></th>`).join('')}</tr></thead><tbody>${PGP.map(g=>`<tr><td>${g[2]} <b>${g[1]}</b></td>${ACTS.map(a=>{const ok=g[0]!=='dash'||a[0]==='v';return`<td style="text-align:center">${ok?`<input type="checkbox" class="pm" id="pm_${g[0]}_${a[0]}" style="width:auto;margin:0" ${pm[g[0]]&&pm[g[0]][a[0]]?'checked':''}>`:'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function pmCol(a,on){document.querySelectorAll('.pm[id$="_'+a+'"]').forEach(x=>{if(!x.disabled)x.checked=on})}
function applyTpl(){const r=$('#ur').value,ad=r==='admin',pm=defPerms(r);
  document.querySelectorAll('.pm').forEach(x=>{const m=x.id.split('_');x.checked=ad||!!(pm[m[1]]&&pm[m[1]][m[2]]);x.disabled=ad});$('#padm').classList.toggle('hide',!ad)}
function openUser(id){
  const u=id?G.users.find(x=>x.id===id):{name:'',code:'',role:'vendeur',stores:[]};
  openM(`<h3>${id?'Modifier':'Nouvel'} utilisateur</h3><div class="grid2"><label>Nom<input id="un" value="${esc(u.name)}"></label><label>Code (4 à 6 chiffres)<input id="uc" inputmode="numeric" maxlength="6" value="${esc(u.code)}"></label>
  <label>Rôle (modèle de droits)<select id="ur" onchange="applyTpl()">${Object.keys(ROLES).map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${ROLES[r]}</option>`).join('')}</select></label></div>
  <p style="margin:12px 0 4px;font-weight:600;color:var(--mu);font-size:12px">MAGASINS AUTORISÉS</p>
  <label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="uall" style="width:auto;margin:0" ${u.stores.includes('*')?'checked':''}> Tous les magasins</label>
  ${G.stores.map(s=>`<label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" class="us" value="${s.id}" style="width:auto;margin:0" ${u.stores.includes(s.id)?'checked':''}> ${s.icon} ${esc(s.name)}</label>`).join('')}
  <p style="margin:14px 0 2px;font-weight:600;color:var(--mu);font-size:12px">DROITS PAR PAGE (menu)</p>
  <p style="margin:0;font-size:12px;color:var(--mu)">Voir = afficher le menu · Opérations = encaisser, règlement, facturer, réceptionner, inventaire. Changer le rôle recharge le modèle correspondant. Utilisateurs et Paramètres restent réservés à l'administrateur.</p>
  <p id="padm" class="hide" style="margin:6px 0;font-weight:700;color:var(--g)">L'administrateur a tous les droits.</p>
  ${permMatrix(permsOf(u))}
  <div class="mb"><button class="btn" onclick="closeM()">Annuler</button><button class="btn pri" onclick="saveUser('${id||''}')">Enregistrer</button></div>`,900);
  if(u.role==='admin'){document.querySelectorAll('.pm').forEach(x=>{x.checked=true;x.disabled=true});$('#padm').classList.remove('hide')}}
function saveUser(id){
  const name=$('#un').value.trim(),code=$('#uc').value.trim(),role=$('#ur').value;
  if(!name)return toast('Nom obligatoire');if(!/^\d{4,6}$/.test(code))return toast('Le code doit avoir 4 à 6 chiffres');
  if(G.users.some(u=>u.code===code&&u.id!==id))return toast('Ce code est déjà utilisé');
  const stores=$('#uall').checked?['*']:[...document.querySelectorAll('.us:checked')].map(x=>x.value);
  if(!stores.length)return toast('Choisissez au moins un magasin');
  let perms=null;
  if(role!=='admin'){perms={};PGP.forEach(g=>{const o={};ACTS.forEach(a=>{const e=document.getElementById('pm_'+g[0]+'_'+a[0]);if(e&&e.checked)o[a[0]]=1});if(Object.keys(o).length){o.v=1;perms[g[0]]=o}});if(!Object.keys(perms).length)return toast('Donnez accès à au moins une page')}
  if(id){const u=G.users.find(x=>x.id===id);if(u.role==='admin'&&role!=='admin'&&G.users.filter(x=>x.role==='admin').length===1)return toast('Gardez au moins un administrateur');Object.assign(u,{name,code,role,stores,perms})}
  else G.users.push({id:uid(),name,code,role,stores,perms});
  saveG();closeM();render();toast('Enregistré');
}
function delUser(id){const u=G.users.find(x=>x.id===id);if(id===USER.id)return toast('Vous ne pouvez pas vous supprimer');if(u.role==='admin'&&G.users.filter(x=>x.role==='admin').length===1)return toast('Gardez au moins un administrateur');if(!confirm('Supprimer cet utilisateur ?'))return;G.users=G.users.filter(x=>x.id!==id);saveG();render()}

function saveStore(id,oldIcon){
  const n=$('#sn').value.trim();if(!n)return toast('Nom du magasin obligatoire');
  const ic=$('#sic').dataset.v||oldIcon,g=i=>$('#'+i).value.trim();
  const co={logo:SLOGO,name:g('mn')||n,addr1:g('ma1'),addr2:g('ma2'),tel:g('mt'),tel2:g('mt2'),email:g('me'),ninea:g('mx'),rc:g('mr'),gerant:g('mg'),footer:$('#mf').value};
  let sid=id;
  if(id)Object.assign(G.stores.find(x=>x.id===id),{name:n,icon:ic});else{sid='s'+uid();G.stores.push({id:sid,name:n,icon:ic})}
  if(sid===SID){Object.assign(D.company,co);save()}else{const d=lg('gt_d_'+sid,null)||newData();d.company=Object.assign({},d.company||{},co);ls('gt_d_'+sid,d)}
  saveG();closeM();render();toast('Magasin enregistré');
}
function delStore(id){if(G.stores.length===1)return toast('Gardez au moins un magasin');if(id===SID)return toast('Changez de magasin avant de supprimer celui-ci');if(!confirm('Supprimer ce magasin ET toutes ses données ?'))return;G.stores=G.stores.filter(x=>x.id!==id);G.users.forEach(u=>{if(!u.stores.includes('*'))u.stores=u.stores.filter(s=>s!==id)});try{localStorage.removeItem('gt_d_'+id)}catch(e){}delete MEM['gt_d_'+id];saveG();render()}
function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='sauvegarde-'+SID+'-'+today()+'.json';a.click()}
function impo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.docs||!d.produits)throw 0;if(!confirm('Remplacer les données de ce magasin par cette sauvegarde ?'))return;D=d;save();loadStore(SID);render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};r.readAsText(f)}
function resetStore(){if(!confirm('Effacer TOUTES les données de ce magasin ?')||!confirm('Dernière confirmation : cette action est définitive.'))return;D=newData();save();render()}

/* ================= RAPPORTS ================= */
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const RPS={pre:'month',from:'',to:''};
function rpRange(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 if(p==='today')return[today(),today()];
 if(p==='week'){const d=new Date(n);d.setDate(n.getDate()-((n.getDay()+6)%7));return[iso(d),today()]}
 if(p==='month')return[iso(new Date(y,m,1)),today()];
 if(p==='last')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))];
 if(p==='year')return[y+'-01-01',today()];
 return['',''];}
{const r=rpRange('month');RPS.from=r[0];RPS.to=r[1]}
const inR=d=>(!RPS.from||d>=RPS.from)&&(!RPS.to||d<=RPS.to);
const S=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const grp=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);(m[k]=m[k]||[]).push(x)});return m};
const FT=()=>D.docs.facture.filter(d=>inR(d.date));
const prodOf=l=>D.produits.find(p=>p.id===l.pid)||{};
const lcost=l=>(+l.qty||0)*(+prodOf(l).pa||0);
const icost=d=>S(d.lines||[],lcost);
const imarge=d=>d.total-icost(d);
const reste=d=>d.total-(d.paid||0);
const mlabel=k=>k.split('-').reverse().join('/');
const pct=(a,b)=>b?a/b*100:0;
const cd=(l,v,al)=>[l,v,!!al];
const lineRows=(L,kf)=>{const m={};L.forEach(d=>(d.lines||[]).forEach(l=>{const p=prodOf(l),k=kf(l,p),o=m[k]=m[k]||{qty:0,ca:0,co:0,p,l};o.qty+=+l.qty||0;o.ca+=(+l.qty||0)*(+l.price||0);o.co+=lcost(l)}));return Object.entries(m).map(([k,o])=>Object.assign({k},o))};
const vCards=L=>[cd('Factures',L.length),cd("Chiffre d'affaires",fmt(S(L,d=>d.total))),cd('Encaissé',fmt(S(L,d=>d.paid))),cd('Reste à encaisser',fmt(S(L,reste)),S(L,reste)>0),cd('Marge brute',fmt(S(L,imarge)))];
const tagStat=d=>stat(d);
const tiers=(kind,id)=>{const e=(kind==='client'?D.clients:D.fournisseurs).find(x=>x.id===id);return e?e.name:(kind==='client'?'Client comptoir':'—')};
const colsGrp=[['Nb','q',1],['Total','n',1],['Encaissé','n',1],['Reste','n',1]];

const RV={
/* ---- Ventes ---- */
vj:()=>{const L=FT(),g=grp(L,d=>d.date);return{cards:vCards(L),cols:[['Date','d'],['Nb factures','q',1],['Total facturé','n',1],['Encaissé','n',1],['Reste à payer','n',1]],rows:Object.keys(g).sort().reverse().map(k=>[k,g[k].length,S(g[k],d=>d.total),S(g[k],d=>d.paid),S(g[k],reste)])}},
vm:()=>{const L=FT(),g=grp(L,d=>d.date.slice(0,7));return{cards:vCards(L),cols:[['Mois','t'],['Nb factures','q',1],['Total facturé','n',1],['Encaissé','n',1],['Marge brute','n',1]],rows:Object.keys(g).sort().reverse().map(k=>[mlabel(k),g[k].length,S(g[k],d=>d.total),S(g[k],d=>d.paid),S(g[k],imarge)])}},
vc:()=>{const L=FT(),g=grp(L,d=>d.tname||'Client comptoir');return{cards:vCards(L),cols:[['Client','t'],...colsGrp],rows:Object.keys(g).map(k=>[k,g[k].length,S(g[k],d=>d.total),S(g[k],d=>d.paid),S(g[k],reste)]).sort((a,b)=>b[2]-a[2])}},
vp:()=>{const L=FT(),R=lineRows(L,(l,p)=>l.pid||l.name);return{cards:vCards(L),cols:[['Réf.','t'],['Produit','t'],['Catégorie','t'],['Qté vendue','q',1],['CA','n',1],["Coût d'achat",'n',1],['Marge','n',1],['Marge %','p']],rows:R.map(o=>[o.l.ref||o.p.ref||'',o.l.name||o.p.name||'',o.p.cat||'—',o.qty,o.ca,o.co,o.ca-o.co,pct(o.ca-o.co,o.ca)]).sort((a,b)=>b[4]-a[4]),note:"Le coût utilise le prix d'achat actuel du produit. Le CA est avant remise globale."}},
vcat:()=>{const L=FT(),R=lineRows(L,(l,p)=>p.cat||'Sans catégorie');return{cards:vCards(L),cols:[['Catégorie','t'],['Qté vendue','q',1],['CA','n',1],["Coût d'achat",'n',1],['Marge','n',1],['Marge %','p']],rows:R.map(o=>[o.k,o.qty,o.ca,o.co,o.ca-o.co,pct(o.ca-o.co,o.ca)]).sort((a,b)=>b[2]-a[2])}},
vv:()=>{const L=FT(),g=grp(L,d=>d.by||'—');return{cards:vCards(L),cols:[['Vendeur','t'],...colsGrp],rows:Object.keys(g).map(k=>[k,g[k].length,S(g[k],d=>d.total),S(g[k],d=>d.paid),S(g[k],reste)]).sort((a,b)=>b[2]-a[2])}},
vmode:()=>{const L=FT(),g=grp(L,d=>d.mode||'—');return{cards:vCards(L),cols:[['Mode de paiement','t'],['Nb factures','q',1],['Total facturé','n',1],['Encaissé','n',1]],rows:Object.keys(g).map(k=>[k,g[k].length,S(g[k],d=>d.total),S(g[k],d=>d.paid)]).sort((a,b)=>b[3]-a[3])}},
vmarge:()=>{const L=FT();return{cards:vCards(L),cols:[['Date','d'],['N°','t'],['Client','t'],['Total','n',1],['Coût','n',1],['Marge','n',1],['Marge %','p']],rows:L.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.num.localeCompare(a.num)).map(d=>[d.date,d.num,d.tname||'Client comptoir',d.total,icost(d),imarge(d),pct(imarge(d),d.total)])}},
vlist:()=>{const L=FT();return{cards:vCards(L),cols:[['Date','d'],['N°','t'],['Client','t'],['Vendeur','t'],['Remise','n',1],['Total','n',1],['Encaissé','n',1],['Reste','n',1],['Statut','g']],rows:L.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.num.localeCompare(a.num)).map(d=>[d.date,d.num,d.tname||'Client comptoir',d.by||'',d.remise||0,d.total,d.paid||0,reste(d),tagStat(d)])}},
/* ---- Clients ---- */
cs:()=>{const R=D.clients.map(c=>{const t=partyTot('client',c.id);return[c.name,c.tel||'',t.t,t.p,c.credit||0,solde('client',c.id)]});
  const cpt=D.docs.facture.filter(d=>!d.tid&&reste(d)>0);if(cpt.length)R.push(['Clients comptoir (impayés)','',S(cpt,d=>d.total),S(cpt,d=>d.paid),0,S(cpt,reste)]);
  R.sort((a,b)=>b[5]-a[5]);const dt=S(R,r=>Math.max(0,r[5]));
  return{cards:[cd('Clients',D.clients.length),cd('Total dû par les clients',fmt(dt),dt>0),cd('Clients débiteurs',R.filter(r=>r[5]>0).length),cd('Avances reçues',fmt(S(D.clients,c=>c.credit)))],cols:[['Client','t'],['Téléphone','t'],['Total facturé','n',1],['Encaissé','n',1],['Avance','n',1],['Solde dû','n',1]],rows:R}},
ci:()=>{const L=D.docs.facture.filter(d=>reste(d)>0&&inR(d.date));return{cards:[cd('Factures impayées',L.length),cd('Montant à encaisser',fmt(S(L,reste)),L.length>0)],cols:[['Date','d'],['N°','t'],['Client','t'],['Total','n',1],['Payé','n',1],['Reste','n',1],['Échéance','d'],['Retard (j)','q']],rows:L.map(d=>[d.date,d.num,d.tname||'Client comptoir',d.total,d.paid||0,reste(d),d.due||d.date,Math.max(0,dd(d.due||d.date,today()))]).sort((a,b)=>b[7]-a[7])}},
cage:()=>{const L=D.docs.facture.filter(d=>reste(d)>0),g=grp(L,d=>d.tname||'Client comptoir'),b=(d,lo,hi)=>{const a=dd(d.due||d.date,today());return a>=lo&&a<=hi?reste(d):0};
  const rows=Object.keys(g).map(k=>{const x=g[k];return[k,S(x,d=>b(d,-1e4,30)),S(x,d=>b(d,31,60)),S(x,d=>b(d,61,90)),S(x,d=>b(d,91,1e5)),S(x,reste)]}).sort((a,b)=>b[5]-a[5]);

const rNum=t=>t==='n'||t==='q'||t==='p';
function rpFmt(v,t){if(t==='n')return fmt(v);if(t==='q')return typeof v==='number'?v.toLocaleString('fr-FR',{maximumFractionDigits:2}):esc(v);if(t==='d')return fd(v);if(t==='p')return (+v).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %';if(t==='g')return`<span class="tag ${v[1]}">${esc(v[0])}</span>`;return esc(v)}
function rpParts(R){const c=R.cols,rows=R.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${rNum(c[i][1])?'r':''}">${rpFmt(v,c[i][1])}</td>`).join('')}</tr>`);
  const foot=c.some(x=>x[2])?`<tr>${c.map((x,i)=>i===0?`<td>Total (${R.rows.length})</td>`:`<td class="${rNum(x[1])?'r':''}">${x[2]?rpFmt(S(R.rows,r=>r[i]),x[1]):''}</td>`).join('')}</tr>`:'';
  return{heads:c.map(x=>(rNum(x[1])?'>':'')+x[0]),rows,foot}}
let RPC=null;
function rpBody(key){
  const C=REP[key];let k=RPS['r_'+key];if(!C.r.some(x=>x[0]===k))k=RPS['r_'+key]=C.r[0][0];
  const x=C.r.find(y=>y[0]===k),R=x[2]();R.title=x[1];R.cat=C.t;R.nodate=!!x[3];RPC=R;
  const pre=[['today',"Aujourd'hui"],['week','Semaine'],['month','Mois'],['last','Mois dernier'],['year','Année'],['all','Tout']],P=rpParts(R);
  return`<div class="rtabs">${C.r.map(y=>`<button class="btn ${y[0]===k?'pri':''}" onclick="rpSel('${key}','${y[0]}')">${y[1]}</button>`).join('')}</div>
  <div class="rbar">${R.nodate?'<b>Situation au '+fd(today())+'</b>':pre.map(p=>`<button class="btn sm ${RPS.pre===p[0]?'gold':''}" onclick="rpPre('${p[0]}')">${p[1]}</button>`).join('')+` Du <input type="date" value="${RPS.from}" onchange="rpCus('from',this.value)"> au <input type="date" value="${RPS.to}" onchange="rpCus('to',this.value)">`}<span style="flex:1"></span><button class="btn sm" onclick="rpCsv()">⬇ Excel (CSV)</button><button class="btn sm" onclick="rpPrint(1)">PDF</button><button class="btn sm pri" onclick="rpPrint()">🖨 Imprimer</button></div>
  <div class="cards">${R.cards.map(c=>`<div class="card ${c[2]?'al':''}"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div>
  ${tbl(P.heads,P.rows,P.foot)}${R.note?`<p style="font-size:12px;color:var(--mu)">${R.note}</p>`:''}`}
const rpSel=(key,k)=>{RPS['r_'+key]=k;res()};
function rpPre(p){RPS.pre=p;const r=rpRange(p);RPS.from=r[0];RPS.to=r[1];res()}
function rpCus(k,v){RPS[k]=v;RPS.pre='custom';res()}
function rpPeriod(R){return R.nodate?'Situation au '+fd(today()):'Période : '+(RPS.from?fd(RPS.from):'début')+' au '+fd(RPS.to||today())}
function rpPrint(pdf){const R=RPC;if(!R)return;const P=rpParts(R),cp=D.company;
  $('#pa').innerHTML=`<div class="rp"><div class="rph"><div><b style="font-size:14px">${esc(cp.name)}</b><br>${esc(cp.addr1||'')} ${esc(cp.tel?'· Tél : '+cp.tel:'')}</div><div style="text-align:right"><h2>${esc(R.title)}</h2>${esc(R.cat)}<br>${rpPeriod(R)}</div></div>
  <div class="rpc">${R.cards.map(c=>`<div>${c[0]}<br><b>${c[1]}</b></div>`).join('')}</div>
  <table class="rpt"><thead><tr>${P.heads.map(h=>`<th class="${h[0]==='>'?'r':''}">${h.replace(/^>/,'')}</th>`).join('')}</tr></thead><tbody>${P.rows.join('')}</tbody>${P.foot?`<tfoot>${P.foot}</tfoot>`:''}</table>
  ${R.note?`<p class="rpn">${R.note}</p>`:''}<p class="rpn">Édité le ${fd(today())} par ${esc(USER.name)}</p></div>`;
  $('#pgs').textContent='@page{size:A4 '+(R.cols.length>6?'landscape':'portrait')+';margin:8mm}';
  const t=document.title;document.title=R.title+' - '+cp.name;window.onafterprint=()=>{document.title=t};
  if(pdf)toast("Dans la fenêtre qui s'ouvre, choisissez « Enregistrer au format PDF » comme imprimante.",5000);
  setTimeout(()=>{try{window.print()}catch(e){toast('Impression indisponible ici : ouvrez le fichier dans votre navigateur')}},pdf?600:120)}
function rpCsv(){const R=RPC;if(!R)return;const q=v=>'"'+String(v).replace(/"/g,'""')+'"',cv=(v,t)=>t==='g'?v[0]:t==='d'?fd(v):t==='n'||t==='q'||t==='p'?(typeof v==='number'?Math.round(v*100)/100:v):v;
  const lines=[R.cols.map(c=>q(c[0])).join(';'),...R.rows.map(r=>r.map((v,i)=>q(cv(v,R.cols[i][1]))).join(';'))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=(R.cat+' '+R.title+' '+today()).replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_')+'.csv';a.click();toast('Fichier exporté')}
Object.keys(REP).forEach(k=>{VIEW[k]=()=>({h:`<div class="ph"><h2>${REP[k].t}<small>${esc(D.company.name)}</small></h2></div>`,b:()=>rpBody(k)})});

</script>
